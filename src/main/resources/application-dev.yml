server:
  port: 11200
github:
  active: dev

spring:
  datasource:
    druid:
      master:
        name: ds_h2
        driver-class-name: org.h2.Driver
        url: jdbc:h2:file:${data.url.master.url}
        username: ${data.url.master.username}
        password: ${data.url.master.password}
        test-while-idle: false
      salve:
        name: ds_sqlite
        driver-class-name: org.sqlite.JDBC
        url: jdbc:sqlite:${data.url.salve.url}
#        url: jdbc:sqlite::resource:${data.url.salve.url}
        username:
        password:
        test-while-idle: false
      use-global-data-source-stat: true
      filters: stat
      initial-size: 10
      min-idle: 10
      max-active: 20
      max-wait: 60000
      # 校验超时时间（毫秒，默认 1000，建议不修改）
      validation-query-timeout: 1000
      validation-query: SELECT 'x' FROM DUAL
      # 开启空闲连接校验（核心！）
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 连接池后台检测线程执行间隔（默认 1 分钟，建议缩短至 10 秒）
      time-between-eviction-runs-millis: 10000
      # 连接在池中最小空闲时间（超过此时间会被尝试回收）,# 5 分钟（小于数据库 wait_timeout）
      min-evictable-idle-time-millis: 300000
      # 连接最大空闲时间（超过此时间强制回收，即使校验通过） ，设置 300 秒（根据业务调整）
      max-evictable-idle-time-millis: 300000
      # 开启连接泄漏检测（超时未关闭则强制回收）
      remove-abandoned: true
      # 连接未关闭的超时时间（秒，默认 300 秒）
      remove-abandoned-timeout: 300
      # 记录泄漏连接的堆栈（调试用，生产环境可关闭）
      log-abandoned: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    #        use_sql_comments: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        enable_lazy_load_no_trans: true
    generate-ddl: false
    defer-datasource-initialization: false
  transaction:
    rollback-on-commit-failure: true
  h2:
    console:
      path: /h2-console
      settings:
        trace: false
        web-allow-others: true
      enabled: true
  cache:
    type: composite
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  redis:
    redisson:
      file: classpath:config/redisson-dev.yml
logging:
  config: classpath:config/logback-spring-dev.xml

dynamic:
  enabled: true