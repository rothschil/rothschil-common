server:
  port: 11000
github:
  active: desktop

spring:
  datasource:
    druid:
      master:
        name: ds_h2
        driver-class-name: com.p6spy.engine.spy.P6SpyDriver
        url: jdbc:p6spy:file:D:/Code/Github/Rothschil/rothschil-common/Doc/h2/Repertory/memdb
        username: sa
        password: 123456
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        validation-query: SELECT 1
        validation-query-timeout: 1000
        initial-size: 2
        min-idle: 2
        max-active: 10
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        break-after-acquire-failure: true
        connection-error-retry-attempts: 10
        time-between-connect-error-millis: 3000
      salve:
        name: ds_sqlite
        driver-class-name: com.p6spy.engine.spy.P6SpyDriver
        url: jdbc:p6spy::resource:${data.url.salve.url}
        username:
        password:
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        validation-query: SELECT 1
        validation-query-timeout: 1000
        initial-size: 2
        min-idle: 2
        max-active: 10
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        break-after-acquire-failure: true
        connection-error-retry-attempts: 10
        time-between-connect-error-millis: 3000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    #        use_sql_comments: true
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        enable_lazy_load_no_trans: true
    generate-ddl: false
    defer-datasource-initialization: true
  transaction:
    rollback-on-commit-failure: true
  h2:
    console:
      path: /h2-console
      settings:
        trace: false
        web-allow-others: true
      enabled: true
  cache:
    type: composite
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  redis:
    redisson:
      file: classpath:config/redisson-dev.yml
logging:
  config: classpath:config/logback-spring-dev.xml

dynamic:
  enabled: true

